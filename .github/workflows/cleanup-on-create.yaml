# This workflow will run upon repository creation and clean up
# all files that are not strictly required to build an AEM Live project
# but that we use to develop the project template. This includes this
# particular workflow file.
# Note: `on: create` is not delivered when a repository is generated from a
# template, so we listen to the initial push instead.
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    # never run in the template repository itself, and otherwise only for the
    # initial commit created when generating a repository from this template
    if: ${{ github.repository != 'adobe/aem-boilerplate' && ( github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Initial commit' ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Remove Helper Files
        run: |
          rm -rf \
            .github/workflows/cleanup-on-create.yaml \
            .github/workflows/sync-block-collection.yaml \
            sync-block-collection.sh \
            .renovaterc.json \
            CHANGELOG.md

      - name: Initialize README
        # replace {repo} and {owner} with the actual values
        run: |
          sed -i.bak "s/{repo}/$(basename ${{ github.repository }})/g" README.md
          sed -i.bak "s/{owner}/$(dirname ${{ github.repository }})/g" README.md
      - name: Initialize AGENTS.md
        run: |
          sed -i.bak "s/{repo}/$(basename ${{ github.repository }})/g" AGENTS.md
          sed -i.bak "s/{owner}/$(dirname ${{ github.repository }})/g" AGENTS.md
      - name: Initialize Pull Request Template
        run: |
          sed -i.bak "s/{repo}/$(basename ${{ github.repository }})/g" .github/pull_request_template.md
          sed -i.bak "s/{owner}/$(dirname ${{ github.repository }})/g" .github/pull_request_template.md


        # commit back to the repository
      - name: Commit changes
        run: |
          git config --local user.email "helix@adobe.com"
          git config --local user.name "AEM Bot"
          git add .
          git commit -m "chore: cleanup repository template"
          git push
